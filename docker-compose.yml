services:

  # 開発環境（現在のDockerfileをそのまま使用）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      # ソースを named volume に置き、bind mount 境界を無くす（反映遅延の根治）
      - chart-src-01:/workspaces/app
      # GitHub CLI 認証状態を named volume に永続化する
      - gh-config:/root/.config/gh
    command: sleep infinity

# ---------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------
volumes:
  # 手順2で手動作成し、ローカルの現物をコピー済みの volume を再利用する
  chart-src-01:
    external: true
  # GitHub CLI 認証状態の永続化先
  gh-config:
