<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>インジケーター管理 UI（プロトタイプ A方式）</title>
  <link rel="stylesheet" href="./css/app.css" />
  <style>
    /* [PROTO] 再生バー（本番に無い唯一の追加UI＝ライブの代わりに再生を駆動） */
    .replay-bar{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#10141d;border-bottom:1px solid #2a2e39;flex-wrap:wrap;font-size:13px;color:#d1d4dc}
    .replay-bar button,.replay-bar select{background:#1b2230;color:#d1d4dc;border:1px solid #2a2e39;border-radius:4px;padding:4px 9px;cursor:pointer}
    .replay-bar .rp-badge{padding:2px 8px;border-radius:4px;background:#2962ff33;color:#7aa2ff;font-weight:600}
    .replay-bar #rp-slider{flex:1;min-width:200px}
    .replay-bar .on{outline:2px solid #2962ff}
    .replay-bar #rp-status{color:#8b95a5;margin-left:auto;font-family:ui-monospace,monospace;font-size:12px}
  </style>
</head>
<body>
  <div id="app">
    <!-- ツールバー：シンボル / 時間足 / インジケーターボタン -->
    <div class="toolbar">
      <span class="tb-symbol">NI225</span>
      <span class="tb-sep"></span>
      <!-- 時間足セレクタ（1 分足原子から resample・§チャート表示時間選択）。data-timeframe は
           サーバの TIMEFRAME_RULES と一致。既定 1D を is-active。A方式では controller が無効化。 -->
      <div class="tb-timeframe" role="group" aria-label="時間足">
        <button class="tb-interval" data-timeframe="1m" type="button">1分</button>
        <button class="tb-interval" data-timeframe="5m" type="button">5分</button>
        <button class="tb-interval" data-timeframe="15m" type="button">15分</button>
        <button class="tb-interval" data-timeframe="1h" type="button">1時間</button>
        <button class="tb-interval" data-timeframe="4h" type="button">4時間</button>
        <button class="tb-interval is-active" data-timeframe="1D" type="button">日</button>
        <button class="tb-interval" data-timeframe="1W" type="button">週</button>
        <button class="tb-interval" data-timeframe="1M" type="button">月</button>
      </div>
      <span class="tb-sep"></span>
      <button id="indicator-open-btn" class="tb-indicator-btn" type="button" title="インジケーター">
        <span class="ic">∿</span>
        <span class="lbl">インジケーター</span>
      </button>
    </div>

    <!-- [PROTO] 再生バー（ライブ自動更新の代わりに時間軸再生を駆動） -->
    <div class="replay-bar" id="replay-bar">
      <span class="rp-badge">REPLAY r2（同時更新）</span>
      <button id="rp-first" title="先頭">⏮</button>
      <button id="rp-prev">◀ 1足</button>
      <button id="rp-play">▶ 再生</button>
      <button id="rp-next">1足 ▶</button>
      <label>速度<select id="rp-speed"><option>1</option><option selected>2</option><option>5</option></select>fps上限</label>
      <button id="rp-follow">直近窓追従</button>
      <input id="rp-slider" type="range" min="0" max="0" value="0" />
      <span id="rp-status">loading…</span>
    </div>

    <!-- チャート + クロスヘア価格読み取り欄 + 凡例 -->
    <div class="chart-wrap">
      <div id="chart"></div>
      <!-- 左上オーバーレイ（読み取り欄→凡例を縦フローで積む。読み取り欄の高さが
           overlay 行数で伸びても #legend が重ならないよう、固定 top でなくフロー配置にする）。 -->
      <div id="chart-overlay-tl">
        <!-- クロスヘア価格読み取り欄（日時 + OHLC + overlay 各行）。
             ChartRenderer.onCrosshairReadout → CrosshairReadoutView.render が描画する。 -->
        <div id="crosshair-readout"></div>
        <div id="legend"></div>
      </div>
    </div>
  </div>

  <!-- ダイアログ：サイドバー(カテゴリ) + 上部タブ + 検索 + 指標一覧 -->
  <div id="indicator-dialog" class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-label="インジケーター">
      <div class="dialog-head">
        <span class="dialog-title">インジケーター、メトリクス、ストラテジー</span>
        <button id="indicator-dialog-close" class="dialog-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="dialog-tabs">
        <button class="dialog-tab is-active" data-tab="indicator" type="button">インジケーター</button>
        <button class="dialog-tab" data-tab="strategy" type="button">ストラテジー</button>
        <button class="dialog-tab" data-tab="profile" type="button">プロファイル</button>
        <button class="dialog-tab" data-tab="pattern" type="button">パターン</button>
      </div>
      <div class="dialog-body">
        <div class="dialog-side">
          <button class="side-item is-active" data-category="" type="button">すべて</button>
          <button class="side-item" data-category="__favorites__" type="button">★ お気に入り</button>
          <button class="side-item" data-category="cat.technical" type="button">テクニカル</button>
          <button class="side-item" data-category="cat.statistics" type="button">統計</button>
          <button class="side-item" data-category="cat.volume" type="button">出来高</button>
        </div>
        <div class="dialog-main">
          <div class="search-wrap">
            <input id="indicator-search" type="text" placeholder="検索" autocomplete="off" />
          </div>
          <div id="indicator-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- bundled lightweight-charts v5.2.0（global LightweightCharts を公開・ネイティブ panes 対応） -->
  <script src="./vendor/lightweight-charts.js"></script>
  <script type="module">
    import { bootstrap, RECENT_BARS } from './js/adapter/front/composition_root_front.js';
    import { setupReplay } from './js/replay.js';
    // [PROTO] 本番フロントをそのまま使い、データ駆動だけ「ライブ→再生」に差し替える。
    //   唯一の違い: LiveUpdater.start()（present 60秒ポーリング）の代わりに setupReplay()。
    bootstrap({
      lwc: window.LightweightCharts,
      container: document.getElementById('chart'),
      doc: document,
      datasetRef: 'jp225_m1',
    }).then(({ chart, controller, renderer, ready, tradeMarkers }) => {
      controller.bind();
      ready.then(() => {
        controller.restore();
        if (tradeMarkers) {
          tradeMarkers.load('/data/trade_markers.json');
        }
        // ライブ更新の代わりに再生ドライバを起動（untilTime をフレーム駆動＝ライブ同一計算）。
        setupReplay({ chart, controller, renderer, datasetRef: 'jp225_m1', recentBars: RECENT_BARS, document });
      });
    });
  </script>
</body>
</html>
