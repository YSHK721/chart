<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>因果リビール再生 UI（INC-F2 再生層）</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/replay_bar.css" />
</head>
<body>
  <div id="app">
    <!-- ツールバー：シンボル / 時間足 / インジケーターボタン -->
    <div class="toolbar">
      <span class="tb-symbol">NI225</span>
      <span class="tb-sep"></span>
      <!-- 時間足ドロップダウンのマウント（ISSUE-122/123）。DOM は共有 timeframe_menu.js（symlink 単一
           ソース）が生成する。replay の対応 8 足（30m なし）は composition root が groups 注入で指定。 -->
      <div class="tf-menu" id="tf-menu"></div>
      <span class="tb-sep"></span>
      <!-- チャートテンプレートのドロップダウンのマウント（基本設計_チャートテンプレート §6.1）。
           DOM は共有 chart_template_menu.js が生成する（HTML 直書きの複製を作らない）。 -->
      <div class="tpl-menu" id="tpl-menu"></div>
      <button id="indicator-open-btn" class="tb-indicator-btn" type="button" title="インジケーター">
        <span class="ic">∿</span>
        <span class="lbl">インジケーター</span>
      </button>
    </div>

    <!-- チャート + クロスヘア価格読み取り欄 + 凡例 -->
    <div class="chart-wrap">
      <div id="chart"></div>
      <!-- 左上オーバーレイ（現在値 → 読み取り欄）。指標の行は ISSUE-276 でペイン別凡例へ移した。 -->
      <div id="chart-overlay-tl">
        <!-- 現在値の大型表示（サイズは CSS 規定・上げ下げ色分け・ライブと同一設計）。CurrentPriceView.render が描画する。 -->
        <div id="current-price"></div>
        <!-- クロスヘア価格読み取り欄（日時 + OHLC + overlay 各行）。
             ChartRenderer.onCrosshairReadout → CrosshairReadoutView.render が描画する。 -->
        <div id="crosshair-readout"></div>
      </div>
      <!-- チャートに重ねる表示系統（ペイン別凡例など）の器はここへ書かない。描画する View が
           自分で .chart-wrap 直下に生成し所有する（overlay_host.js・ライブと同一実装）。 -->
    </div>
    <!-- Market Profile リプレイモードの scrub バーのホスト（チャート下部・sibling）。
         MarketProfileReplayBar が replay モード ON 時のみ内部で表示する（既定は空・非表示）。
         #chart 内へ差し込まない（lightweight-charts が canvas を専有するため sibling へ置く）。
         これは MP replay モード専用の第 2 カーソルで、上部のリビール再生バーとは独立（二重カーソル許容）。 -->
    <div id="mp-replay-bar-host"></div>

    <!-- [INC-F2] 再生バー（ライブ自動更新の代わりに時間軸再生を駆動＝本番に無い唯一の追加UI）。
         チャート下端・中央寄せ。要素の意味は css/replay_bar.css の冒頭コメントを参照。
         単体ページには「リプレイ終了（✕）」が無い（戻り先のライブが無いため。統合 UI のみ持つ）。 -->
    <div class="replay-bar" id="replay-bar">
      <div class="rp-group">
        <button id="rp-range" type="button" title="表示期間 / 再生開始日">全期間</button>
        <button id="rp-range-caret" type="button" aria-haspopup="true" title="カレンダー / 期間プリセット">⌄</button>
        <span class="rp-sep"></span>
        <button id="rp-view-left" class="rp-icon" type="button" title="チャート表示を左端へスクロール（再生位置は変えない）">‖◁</button>
        <button id="rp-prev" class="rp-icon" type="button" title="1足戻る">|◁</button>
        <button id="rp-play" class="rp-icon" type="button" title="再生 / 一時停止（再生中は再生位置に追随）">▷</button>
        <button id="rp-next" class="rp-icon" type="button" title="1足進む">▷|</button>
        <button id="rp-view-right" class="rp-icon" type="button" title="チャート表示を右端へスクロール（再生位置は変えない）">▷‖</button>
        <span class="rp-sep"></span>
        <button id="rp-speed" type="button" data-speed="1" aria-haspopup="true" title="再生速度（1.00=最速・0.00=一時停止・リアルタイム＝実時間）">x1.00</button>
        <select id="rp-mode" class="rp-select" title="最新足を足内で更新する方法（MT5 モデリング相当）">
          <option value="real_ticks">実ティック</option>
          <option value="every_tick">全ティック合成</option>
          <option value="ohlc_1min" selected>1分OHLC</option>
          <option value="open_only">始値のみ</option>
          <option value="math">数学計算(終値)</option>
        </select>
        <span id="rp-eta" class="rp-eta" title="完了予想時間（残り足 × 実測の1足あたり所要）">完了予想 —</span>
      </div>
    </div>
  </div>

  <!-- ダイアログ：サイドバー(カテゴリ) + 上部タブ + 検索 + 指標一覧 -->
  <div id="indicator-dialog" class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-label="インジケーター">
      <div class="dialog-head">
        <span class="dialog-title">インジケーター、メトリクス、ストラテジー</span>
        <button id="indicator-dialog-close" class="dialog-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="dialog-tabs">
        <button class="dialog-tab is-active" data-tab="indicator" type="button">インジケーター</button>
        <button class="dialog-tab" data-tab="strategy" type="button">ストラテジー</button>
        <button class="dialog-tab" data-tab="profile" type="button">プロファイル</button>
        <button class="dialog-tab" data-tab="pattern" type="button">パターン</button>
      </div>
      <div class="dialog-body">
        <div class="dialog-side">
          <button class="side-item is-active" data-category="" type="button">すべて</button>
          <button class="side-item" data-category="__favorites__" type="button">★ お気に入り</button>
          <!-- カテゴリのボタンはカタログから動的生成する（ISSUE-221）。ここへ直書きすると
               新カテゴリの指標を足したときに HTML の同時改変が必要になり、実際に
               oscillator(10) と band(2) が欠落して 24 指標中 12 件が到達不能になっていた。 -->
        </div>
        <div class="dialog-main">
          <div class="search-wrap">
            <input id="indicator-search" type="text" placeholder="検索" autocomplete="off" />
          </div>
          <div id="indicator-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- bundled lightweight-charts v5.2.0（global LightweightCharts を公開・ネイティブ panes 対応） -->
  <script src="./vendor/lightweight-charts.js"></script>
  <script type="module">
    // [INC-F2] 再生層結線。本番フロントをそのまま使い、データ駆動だけ「ライブ→再生」に差し替える。
    //   唯一の違い: LiveUpdater.start()（present 60秒ポーリング）の代わりに setupReplay()＝
    //   untilTime をフレーム駆動し controller.recomputeAllApplied で「その時点」を因果計算する。
    import { bootstrap, RECENT_BARS } from './js/adapter/front/composition_root_front.js';
    import { setupReplay } from './js/replay.js';
    // ISSUE-166 の vendor 読込ガード（cache-bust 再試行）は共有モジュール（ライブ実体を
    //   symlink 参照）が所有する。ISSUE-278 #11: inline の手書き複製をやめる。
    import { ensureLightweightCharts } from './js/adapter/front/vendor_loader.js';
    const lwc = await ensureLightweightCharts();
    if (!lwc) {
      console.error('ISSUE-166: lightweight-charts.js の読込に 3 回失敗しました。ページを再読込してください。');
    }
    lwc && bootstrap({
      lwc: window.LightweightCharts,
      container: document.getElementById('chart'),
      doc: document,
      datasetRef: 'jp225_tick',
    }).then(({ chart, mainSeries, controller, renderer, ready, marketProfile, tickvolBands }) => {
      controller.bind();
      window.__rpTickvolBands = tickvolBands; // E2E フック（__rpChart と同規約・描画には不使用）
      ready.then(() => {
        controller.restore();
        // ライブ更新の代わりに再生ドライバを起動（untilTime をフレーム駆動＝ライブ同一計算）。
        //   marketProfile（slim actor・composition root が controller と同一実体を注入）を渡し、
        //   indicator メニュー（market_profile）で有効化された actor の足内 tick 逐次成長を駆動する。
        setupReplay({ chart, mainSeries, controller, renderer, datasetRef: 'jp225_tick', recentBars: RECENT_BARS, document, marketProfile });
      });
    });
  </script>
</body>
</html>
