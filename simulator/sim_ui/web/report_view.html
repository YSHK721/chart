<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>シミュレーション結果</title>

  <!-- 表示の実体を載せる**子文書**（統合ページは iframe でこれを開く・裁定 B）。

       なぜ別文書にするか（実 UI 実測 2026-08-11）:
         下の style.css は移植元 report_ui の**全画面ページ用 CSS** で、`body` そのものに
         背景・文字色・font・height:100vh・display:flex を与える。統合ページへ直接 link
         すると sim と無関係な既存 UI の見た目まで変わった（body 背景 19,23,34 → 14,17,23／
         font "Helvetica Neue",Arial → Tahoma）。CSS を書き換えれば「見た目の複製」になり
         単一ソースが壊れる。**同じ CSS をそのまま使い、波及だけを止める**構造がこれである。

       このページが持つのは「器」だけである:
         - 移植元 style.css（実体を link・写さない）
         - 共有 vendor の lightweight-charts v5.2.0（report_ui の v4.1.3 はどの経路にも載せない）
         - sim 表示層の合成根 1 本
       3 窓・取引明細の DOM は **View（sim_display_view.js）が生成し所有する**。ここへ
       骨格を書き写さない（ISSUE-278 #16 と同じ規約。import_source.test.js が機械強制する）。

       job_id は親が付けた `?job=<id>` を合成根が読む（親子で読み方を二重化しない）。 -->
  <link rel="stylesheet" href="/sim/report-css/style.css" />
  <!-- 器（#sim-display）の寸法だけを持つ sim 所有 CSS。style.css は body を縦 flex の
       全画面レイアウトにするので、その**伸びる子**にしないと 3 窓の高さが 0 基準で解決され
       2px に潰れる（実測 2026-08-12）。統合ページ側と同じ 1 枚を読む（規則を分けない）。 -->
  <link rel="stylesheet" href="/sim/css/sim_display.css" />
  <!-- 投入フォーム（`?job=` 無しで開いたときの入口）の表示整形。選択子はすべて
       #simTesterPanel / #simEaInputsPanel / #simRunActionPanel の配下に閉じてあるので、
       結果ビューア（`?job=<id>`）の見た目には 1 つも当たらない（波及遮断・裁定 B）。
       色は style.css の :root 変数だけを使う（hex をこちらへ写さない）。 -->
  <link rel="stylesheet" href="/sim/css/sim_run_form.css" />
</head>
<body>
  <!-- 比較・判定タブ（FR-17/18）が使う Chart.js v4.4.1（report_ui の vendor 実体・無改変）。
       compare.js は `typeof Chart === "undefined"` で**無音でスキップ**するため、これが
       無いとグラフだけが黙って出ない。lightweight-charts は下の共有 v5.2.0 だけを載せる
       （report_ui の v4.1.3 は allowlist 非収録＝経路そのものが無い）。 -->
  <script src="/sim/report-vendor/chart.umd.js"></script>
  <script src="/sim/vendor/lightweight-charts.js"></script>
  <script type="module">
    import { mountSimReportView } from '/sim/js/adapter/front/composition_root_front.js';
    import { mountSimExecutionPanel } from '/sim/js/adapter/front/composition_root_execution.js';

    // `?job=<id>` の有無で dispatch（Phase 6 拡張）:
    //   有 → 既存の結果ビューア（byte 等価・従来経路）
    //   不在 → 実行指示パネル（run config フォーム・投入して job を作る入口）
    // 分岐は 1 箇所だけが持つ（親子で読み方を二重化しない・自動介入なし）。
    const hasJob = new URLSearchParams(location.search).get('job');

    // 失敗しても `__simReportViewReady` は必ず立てる（親・E2E が待ち続けないため）。
    // 何が起きたかは View がページ上に掲示する（部分描画しない・fail-stop）。
    try {
      if (hasJob) {
        await mountSimReportView({
          doc: document,
          lwc: window.LightweightCharts,
          host: document.body,
        });
      } else {
        await mountSimExecutionPanel({ doc: document, host: document.body });
      }
    } finally {
      window.__simReportViewReady = true;
    }
  </script>
</body>
</html>
