<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>シミュレーション結果レポートビューア（report_ui）</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- vendor（v4.1.3 / v4.4.1・無断バージョン変更禁止） -->
  <script src="vendor/lightweight-charts.standalone.js"></script>
  <script src="vendor/chart.umd.js"></script>
</head>
<body>
  <header id="topbar">
    <h1>シミュレーション結果レポート</h1>
    <div class="seg-area">
      <label for="seg-select">区間</label>
      <select id="seg-select">
        <option value="is">IS（学習）</option>
        <option value="oos">OOS（検証）</option>
      </select>
      <span id="verdict-badge" class="badge"></span>
    </div>
    <div id="meta-line" class="meta-line"></div>
  </header>

  <main>
    <!-- サマリーカード -->
    <section id="summary-cards" class="cards"></section>

    <!-- ローソク足チャート -->
    <section class="chart-area">
      <h2>価格チャート（ローソク足）</h2>
      <div id="price-chart" class="chart"></div>
    </section>

    <!-- 下部マルチビュー枠（F-1 は枠のみ・後段でタブ実体化） -->
    <section id="multiview" class="multiview">
      <div class="mv-tabs">
        <button class="mv-tab active" data-tab="placeholder">マルチビュー（後段で実体化）</button>
      </div>
      <div id="mv-body" class="mv-body">
        <p class="placeholder-note">
          取引明細・ヒートマップ・グラフ群・比較判定はステージ②以降で実装します（F-1 は枠）。
        </p>
      </div>
    </section>
  </main>

  <div id="error-banner" class="error hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
