# pytest の依存解決点を単一化するための最小設定（ISSUE-174 案 a）。
#
# ここには pytest 設定のみを置く。Python バージョン・依存ライブラリの宣言は
# requirements.txt / requirements-dev.txt を単一情報源とし、本ファイルへ移さない
# （ビルドバックエンドも導入しない＝[build-system] / [project] は置かない）。
#
# pythonpath: rootdir（= 本ファイルのあるリポジトリ根）**からの相対**で sys.path へ載せる。
#   repo 根直下の固有名パッケージ（common / common_view / marketdata / api_shared /
#   datawindow / tools）と
#   market_profile_api を、どのパッケージディレクトリから pytest を起動しても解決可能にする。
#
#   値の唯一源は tools/dev_paths.txt（ISSUE-279）。一致は
#   tools/tests/test_dev_paths_single_source.py が強制するので、台帳と本表は同時に更新する。
#   絶対パスを書かないこと: git worktree で pytest を回したとき、main チェックアウトの実装を
#   テストしてしまい「worktree で緑」が偽になる（venv の .pth が絶対パス固定である問題と同型）。
#   実行時（サーバ起動）の同解決は tools/dev_paths.sh（serve.sh が source）が担う。
[tool.pytest.ini_options]
pythonpath = [".", "indigators/market_profile/api", "indigators"]
