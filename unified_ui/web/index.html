<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unified UI (Live / Replay)</title>
  <!-- モード別スタイル（既存 core の css/app.css をプロキシ経由で読む・byte 不変）。
       href は unified_root.js が activeMode に応じて切り替える（初期 = live）。 -->
  <link id="mode-css" rel="stylesheet" href="/live/css/app.css" />
  <style>
    /* 統合層固有の最小スタイル（既存 css へ波及させないための局所定義）。 */
    .um-mode-live #replay-bar { display: none; }
    /* リプレイ中はライブ追従「ライブ」ボタンを消さず、グレーアウト＋操作不可にする
       （UI 要素の増減による認知負荷を避ける＝両モードで同じ配置を保つ）。 */
    .um-mode-replay #live-follow-toggle { opacity: .4; pointer-events: none; }
    /* 「リプレイ」はオン・オフのトグル（両モードで常に表示）。リプレイモード選択中は
       aria-pressed=true でアクセント青に点灯させ、どのモードかが一目で分かるようにする
       （既存 css の tb-interval は id 指定でないと点灯しないため、ここで明示指定する）。 */
    #enter-replay[aria-pressed="true"] { background: #2962ff; color: #fff; border-color: #2962ff; }

    /* 再生バーのダークテーマ配色（参照実装 simulator/replay_ui/web/index.html の忠実移植）。
       これが無いと再生バーのボタン/セレクトが既定の白ボタンになり、ライブと色が食い違う。 */
    .replay-bar{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#10141d;border-bottom:1px solid #2a2e39;flex-wrap:wrap;font-size:13px;color:#d1d4dc}
    .replay-bar button,.replay-bar select{background:#1b2230;color:#d1d4dc;border:1px solid #2a2e39;border-radius:4px;padding:4px 9px;cursor:pointer}
    .replay-bar .rp-badge{padding:2px 8px;border-radius:4px;background:#2962ff33;color:#7aa2ff;font-weight:600}
    .replay-bar #rp-slider{flex:1;min-width:200px}
    .replay-bar .rp-sep{width:1px;align-self:stretch;background:#2a2e39;margin:0 2px}
    .replay-bar button.rp-disabled{opacity:.4;cursor:not-allowed}
    .replay-bar #rp-play.rp-playing{background:#16a34a;color:#fff;border-color:#16a34a}
    .replay-bar #rp-play{min-width:84px;text-align:center}
    .replay-bar .on{outline:2px solid #2962ff}
    #rp-presets{display:inline-flex;gap:4px}
    #rp-presets .rp-preset{padding:3px 8px}
    #rp-presets .rp-preset.on{background:#2962ff;color:#fff;border-color:#2962ff}
  </style>
</head>
<body class="um-mode-live">
  <!-- 統合エントリ。モード切替は #mode-ui 内ツールバーの「リプレイ」オン・オフトグル
       （#enter-replay）で行う（unified_root.js が mount 毎に配線）。 -->
  <!-- フェイルクローズ用のエラー表示（🟡-3: SW 未制御／モード読込失敗を明示）。 -->
  <div id="mode-error" role="alert" style="display:none;padding:8px 10px;background:#7a1f1f;color:#fff"></div>

  <!-- モード切替のたびに丸ごと pristine 復元する UI サブツリー（🟡-6: bind() のリスナ蓄積を根絶）。
       teardown で innerHTML を初期スナップショットへ戻し、次 mount は無リスナの新 DOM へ配線する。 -->
  <div id="mode-ui">
  <div id="app">
    <!-- ツールバー（時間足メニュー・ライブ追従・インジケーター）。DOM 実体は共有 UI 部品が生成。 -->
    <div class="toolbar">
      <span class="tb-symbol">NI225</span>
      <span class="tb-sep"></span>
      <div class="tf-menu" id="tf-menu"></div>
      <span class="tb-sep"></span>
      <button id="live-follow-toggle" class="tb-interval" type="button" aria-pressed="false" title="ライブ追従（点灯=ライブ／消灯=分析）" disabled>ライブ</button>
      <span class="tb-sep"></span>
      <button id="indicator-open-btn" class="tb-indicator-btn" type="button" title="インジケーター">
        <span class="ic">∿</span>
        <span class="lbl">インジケーター</span>
      </button>
      <span class="tb-sep"></span>
      <!-- リプレイのオン・オフトグル（両モードで表示。off=ライブ / on=リプレイ）。unified_root.js が
           activeMode に応じて toggle し、aria-pressed で点灯状態を反映する。 -->
      <button id="enter-replay" class="tb-interval" type="button" aria-pressed="false" title="リプレイ表示のオン・オフ">リプレイ</button>
    </div>

    <!-- リプレイ操作バー（replay モードのみ表示・live では CSS で非表示）。 -->
    <div class="replay-bar" id="replay-bar">
      <button id="rp-prev">◀ 1足</button>
      <button id="rp-play">▶ 再生</button>
      <button id="rp-next">1足 ▶</button>
      <label title="再生速度（1.00=最速。小さいほど遅い＝観察用）">速度<input id="rp-speed" type="range" min="0" max="1" step="0.01" value="1" style="vertical-align:middle;width:90px" /><span id="rp-speed-val" style="display:inline-block;min-width:2.6em;text-align:right">1.00</span></label>
      <span id="rp-speed-presets"></span>
      <span id="rp-eta" title="完了予想時間（残り足 × 実測の1足あたり所要）">完了予想 —</span>
      <label title="最新足を足内で更新する方法（MT5 モデリング相当）">最新足更新<select id="rp-mode">
        <option value="real_ticks">実ティック</option>
        <option value="every_tick">全ティック合成</option>
        <option value="ohlc_1min" selected>1分OHLC</option>
        <option value="open_only">始値のみ</option>
        <option value="math">数学計算(終値)</option>
      </select></label>
      <button id="rp-follow">再生追従</button>
      <button id="rp-view-left" title="チャート表示を左端へスクロール（再生位置は変えない）">⇤ 表示左端</button>
      <button id="rp-view-right" title="チャート表示を右端へスクロール（再生位置は変えない）">表示右端 ⇥</button>
      <span id="rp-presets"></span>
      <input id="rp-slider" type="range" min="0" max="0" value="0" />
      <span id="rp-status" style="min-width:0"></span>
    </div>

    <!-- チャート + クロスヘア価格読み取り欄 + 凡例（両モード共有ホスト）。 -->
    <div class="chart-wrap">
      <div id="chart"></div>
      <div id="chart-overlay-tl">
        <div id="current-price"></div>
        <div id="crosshair-readout"></div>
        <div id="legend"></div>
      </div>
    </div>
    <!-- Market Profile リプレイバーのホスト（replay の MP replay=ON で動的生成）。 -->
    <div id="mp-replay-bar-host"></div>
  </div>

  <!-- インジケーターダイアログ（両モード共有）。 -->
  <div id="indicator-dialog" class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-label="インジケーター">
      <div class="dialog-head">
        <span class="dialog-title">インジケーター、メトリクス、ストラテジー</span>
        <button id="indicator-dialog-close" class="dialog-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="dialog-tabs">
        <button class="dialog-tab is-active" data-tab="indicator" type="button">インジケーター</button>
        <button class="dialog-tab" data-tab="strategy" type="button">ストラテジー</button>
        <button class="dialog-tab" data-tab="profile" type="button">プロファイル</button>
        <button class="dialog-tab" data-tab="pattern" type="button">パターン</button>
      </div>
      <div class="dialog-body">
        <div class="dialog-side">
          <button class="side-item is-active" data-category="" type="button">すべて</button>
          <button class="side-item" data-category="__favorites__" type="button">★ お気に入り</button>
          <button class="side-item" data-category="cat.technical" type="button">テクニカル</button>
          <button class="side-item" data-category="cat.statistics" type="button">統計</button>
          <button class="side-item" data-category="cat.volume" type="button">出来高</button>
        </div>
        <div class="dialog-main">
          <div class="search-wrap">
            <input id="indicator-search" type="text" placeholder="検索" autocomplete="off" />
          </div>
          <div id="indicator-list"></div>
        </div>
      </div>
    </div>
  </div>
  </div><!-- /#mode-ui -->

  <!-- lightweight-charts（global LightweightCharts）は unified_root.js が **アクティブモードの
       prefix**（/live または /replay）から動的ロードする（🔴-1 隔離: 起動時に反対モード core へ
       依存しない）。両 core とも vendor/lightweight-charts.js を配信するため active 側から取得できる。 -->
  <script type="module" src="/js/unified_root.js"></script>
</body>
</html>
