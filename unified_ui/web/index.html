<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unified UI (Live / Replay)</title>
  <!-- モード別スタイル（既存 core の css/app.css をプロキシ経由で読む・byte 不変）。
       href は unified_root.js が activeMode に応じて切り替える（初期 = live）。 -->
  <link id="mode-css" rel="stylesheet" href="/live/css/app.css" />
  <!-- リプレイバーのスタイルは replay core の単一ソースを link で共有する（複製しない）。 -->
  <link rel="stylesheet" href="/replay/css/replay_bar.css" />
  <style>
    /* 統合層固有の最小スタイル（既存 css へ波及させないための局所定義）。 */
    /* リプレイ操作バーは「replay モードのときだけ出す」。**ライブのときだけ隠す**という 2 値の
       裏返しで書くと、live でも replay でもないモード（sim）は隠す条件に当てはまらず、バーが
       出たままになる。既定を非表示にしておけば、モードを増やしてもこの規則は直さなくてよい
       （表駆動と同じ性質）。
       表示値 flex は replay_bar.css の .replay-bar と同値＝リプレイ時の見えは不変。 */
    #replay-bar { display: none; }
    .um-mode-replay #replay-bar { display: flex; }
    /* ライブ追従「ライブ」ボタンは live モードでのみ意味を持つ（LiveUpdater 稼働＋新足で
       右端追従＝live_follow_controller.js:5-9）。live 以外への遷移は必ず stopPollers() で
       LiveUpdater を止めるため、押しても何も起きない。よってボタンは消さず、グレーアウト＋
       操作不可にする（UI 要素の増減による認知負荷を避ける＝全モードで同じ配置を保つ）。
       書き方は #replay-bar と同じ反転側で持つ: 「replay のとき無効」とモードを列挙すると、
       モードが増えるたびにセレクタを足す義務が生まれる。「live のとき以外は無効」なら
       第 4 モードでも本規則は変わらない。 */
    body:not(.um-mode-live) #live-follow-toggle { opacity: .4; pointer-events: none; }
    /* ダッシュボードは**チャート画面には置かない**（設計書 §4.6 依頼者裁定 2026-08-29:
       チャートは詳細分析の場であり画面を広く保つ）。dashboard モードではチャートを隠し、
       シートの器（#um-dashboard-area・unified_root.js が生成し所有）が版面全体を使う。
       既定は非表示＝#replay-bar と同じ「そのモードのときだけ出す」表駆動の性質で、
       モードを増やしてもこの規則は直さなくてよい（ISSUE-460）。 */
    #um-dashboard-area { display: none; }
    .um-mode-dashboard #um-dashboard-area { display: block; flex: 1 1 auto; min-height: 0; overflow: auto; }
    .um-mode-dashboard .chart-wrap { display: none; }
    /* チャート API（/candles・/compute）を持たない core のモードでは、チャート操作系を
       触らせない。持たない core へ操作を送っても 404 が返るだけで**画面には何も起きない**
       （無音の失敗）ので、押せないことを見た目で示す。判定は body の状態クラスの有無で行い、
       モード名は書かない（applyModeUi が um-chart-api を付け外しする＝第 4 モードでも本規則は不変）。
       モード切替ボタン（#enter-replay / #enter-sim）は**対象に含めない**。含めるとそのモードから
       出られなくなる。
       対象は「チャート API を実際に叩く操作」だけに絞る（実測）:
         #tf-menu           … indicator_controller.js:1224 → setTimeframe → candles + compute
         #tpl-menu          … chart_template_controller.js:364-372 が compute を並列発行
         #indicator-open-btn… indicator_dialog_controller.js:108 → applyIndicator → compute
         .pane-legend-gear  … 同:1295 → _onGear:1313 → プロパティ OK → _applyDialogResult:1375
                              → recomputeInstance:688 → _computeInstance（DOM 不在時は
                              _gearRecompute:1385-1393 経由で同じく recomputeInstance）
       対象外（compute を発行しないので core が何であっても動く。動くものを塞ぐと
       「押せない理由が説明できない UI」になる）:
         指標カラーテーマのメニュー … 適用は再計算を伴わない（color_theme_controller.js:25-28）
         凡例の目 ●／○（表示切替）  … 同:1292 → toggleVisible:808-816（setVisible / persist / 再描画）
         凡例の ✕（削除）           … 同:1296 → removeInstance:838-848（remove / facadeRemove / persist）
       （テーマの器の id をここへ書かないこと: 器は app_chrome_view が所有し、HTML は 1 枚も
         触らない規約＝ISSUE-278 #16。検定 TC-CT05 が文字列の出現を 0 件で固定している。） */
    body:not(.um-chart-api) #tf-menu,
    body:not(.um-chart-api) #tpl-menu,
    body:not(.um-chart-api) #indicator-open-btn,
    body:not(.um-chart-api) .pane-legend-gear { opacity: .4; pointer-events: none; }
    /* 表示層が**下部ペイン**を使うモード（表の bottomPane=true・sim）では、その表示層
       （#sim-display）を下部ペインへ出し、チャートは畳まない（裁定 2026-08-21・依頼者指示）。
       判定はモード名ではなく body の状態クラス um-bottom-pane-mode（applyModeUi が表から
       付け外し）で行う: um-chart-api の裏返しで書くと、chart API を持たない第 4 モード
       （dashboard）で**空のペイン**が出る（ISSUE-460 で実発生）。
       旧規則は `body:not(.um-chart-api) .chart-wrap { display: none }`＝版面の**排他**で、
       sim を押すとチャートが消えていた（承認 H-C）。参照実装の MT5 はストラテジーテスターを
       下部ドックペインに出し、チャートは上に残す。よって版面は排他ではなく**縦 2 分割**にする。
       器（#um-bottom-splitter / #um-bottom-pane）の DOM は bottom_pane_view.js が生成し所有する
       （HTML は 1 枚も触らない規約＝ISSUE-278 #16）。ここが持つのは寸法と出し入れの規則だけ。
       出し入れは #replay-bar と同じ反転記法（既定は非表示／条件を満たすときだけ出す）で書く。
       モード名を書かないので、第 4 モードを表へ足しても本規則は直さなくてよい。 */
    #um-bottom-splitter, #um-bottom-pane { display: none; }
    body.um-bottom-pane-mode #um-bottom-splitter { display: block; }
    body.um-bottom-pane-mode #um-bottom-pane { display: flex; }
    /* 分割線: 掴める境界。高さは bottom_pane_view.js の SPLITTER_PX と同値（可動域の計算に使う）。 */
    #um-bottom-splitter {
      flex: 0 0 6px; height: 6px; cursor: row-resize; touch-action: none;
      background: var(--ct-uiBorder, #2a2e39);
    }
    #um-bottom-splitter:hover { background: var(--ct-uiTextDim, #787b86); }
    /* 下部ペイン: 既定は版面の 45%。ドラッグしたときだけ View が flex-basis を px で上書きする
       （既定値を JS に持たせない＝起動時に版面へ手を入れない）。中身（表示層）は縦に伸ばす。
       縮み側は 1（ウィンドウを縮めたときはペインも譲る）。譲らせないと、ドラッグで広げた px が
       そのまま残り、flex はチャート側だけを削ってチャートが消える（実測 2026-08-21）。
       両側の**下限**（px）はここに書かない: 同じ数値がドラッグの可動域計算と CSS に分かれて
       置かれるとずれるので、bottom_pane_view.js の定数から View が版面へ書く。 */
    #um-bottom-pane {
      flex: 0 1 45%; overflow: hidden; flex-direction: column;
      background: var(--ct-uiSurface, #131722);
    }
    /* モード切替ボタンはオン・オフのトグル（全モードで常に表示）。選択中のモードは
       aria-pressed=true でアクセント青に点灯させ、どのモードかが一目で分かるようにする
       （既存 css の tb-interval は id 指定でないと点灯しないため、ここで明示指定する）。 */
    #enter-replay[aria-pressed="true"],
    #enter-sim[aria-pressed="true"],
    #enter-dashboard[aria-pressed="true"] { background: #2962ff; color: #fff; border-color: #2962ff; }
  </style>
</head>
<!-- 初期クラスは既定モード（live）の状態と一致させる。applyModeUi が走るのは bootstrap 完了後
     なので、ここが実態とずれていると「ツールバーは出ているのにチャート操作がグレーアウト」
     という状態が初期化中だけ現れる（um-chart-api は live core が /candles・/compute を
     持つことを表す）。 -->
<body class="um-mode-live um-chart-api">
  <!-- 統合エントリ。モード切替は #mode-ui 内ツールバーの「リプレイ」オン・オフトグル
       （#enter-replay）で行う（unified_root.js が mount 毎に配線）。 -->
  <!-- フェイルクローズ用のエラー表示（🟡-3: SW 未制御／モード読込失敗を明示）。 -->
  <div id="mode-error" role="alert" style="display:none;padding:8px 10px;background:#7a1f1f;color:#fff"></div>

  <!-- モード切替のたびに丸ごと pristine 復元する UI サブツリー（🟡-6: bind() のリスナ蓄積を根絶）。
       teardown で innerHTML を初期スナップショットへ戻し、次 mount は無リスナの新 DOM へ配線する。 -->
  <div id="mode-ui">
  <div id="app">
    <!-- ツールバー（シンボル / 時間足 / ライブ追従 / テンプレート / インジケーター / リプレイトグル）の
         DOM は app_chrome_view.js が生成し所有する（ISSUE-278 #16: 3 ページ手書き複製の撤去）。
         ページが要求されるのはアンカー #app だけ。リプレイトグルはリプレイ層注入時のみ置かれる。 -->

    <!-- チャート + クロスヘア価格読み取り欄（両モード共有ホスト）。
         指標の凡例はここに書かない: ペイン別凡例の器は PaneLegendView が .chart-wrap 直下へ
         自分で生成し所有する（overlay_host.js）。旧 #legend（左上に全件を縦積み）は ISSUE-276 で
         撤去済みで、core 2 ページからは消えていたが本ページだけ取り残されていた（ISSUE-277）。 -->
    <div class="chart-wrap">
      <div id="chart"></div>
      <!-- 左上オーバーレイ（現在値 → クロスヘア読み取り欄）の器は各 View が版面配下へ自分で
           生成し所有する（ISSUE-277 の残: 3 ページ手書き複製の撤去）。DOM の並びは合成根の
           構築順（現在値 → 読み取り欄）で決まる。 -->
    </div>
    <!-- Market Profile リプレイバーのホスト（replay の MP replay=ON で動的生成）。 -->
    <div id="mp-replay-bar-host"></div>

    <!-- リプレイ操作バー（#replay-bar）の DOM は replay_bar_view.js が生成し所有する
         （ISSUE-278 #16: 2 ページ複製で rp-speed の title だけが実際にドリフトしていた）。
         「リプレイ終了（✕）」は統合 UI のみ＝withClose 注入で表す。 -->
  </div>

  <!-- 指標追加ダイアログ（#indicator-dialog）の DOM は app_chrome_view.js が生成し所有する
       （ISSUE-278 #16: 3 ページで 1440 文字が byte 一致の複製だった）。 -->
  </div><!-- /#mode-ui -->

  <!-- lightweight-charts（global LightweightCharts）は unified_root.js が **アクティブモードの
       prefix**（/live または /replay）から動的ロードする（🔴-1 隔離: 起動時に反対モード core へ
       依存しない）。両 core とも vendor/lightweight-charts.js を配信するため active 側から取得できる。 -->
  <script type="module" src="/js/unified_root.js"></script>
</body>
</html>
